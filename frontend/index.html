<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PersonnelAI — AI-based predictive personnel stress & welfare monitoring prototype" />
    <title>PersonnelAI — Predictive Welfare Monitoring</title>
    <script>
      // Light mode is the default; only opt-in dark via stored preference.
      try {
        if (localStorage.getItem('cp-theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.background = '#050B18'
        }
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
