<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PersonnelAI — AI-based predictive personnel stress & welfare monitoring prototype" />
    <title>PersonnelAI — Predictive Welfare Monitoring</title>
    <style>.netlify-badge, [data-netlify], .nf-open, #nf-dialog, .nf-dialog, [class*="netlify"]{display:none!important;pointer-events:none!important;opacity:0!important;height:0!important;width:0!important;overflow:hidden!important;position:fixed!important;z-index:-1!important}</style>
    <script>
      try { localStorage.setItem('nl-hud:public:v1', 'hidden'); } catch(e) {}
      try {
        if (localStorage.getItem('cp-theme') === 'dark') {
          document.documentElement.classList.add('dark')
          document.documentElement.style.background = '#050B18'
        }
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
